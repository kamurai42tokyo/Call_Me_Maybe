# このプロジェクトの設定ファイル（uv sync で読み込まれる）
#
# [project]
#   name            : プロジェクト名
#   version         : バージョン
#   description     : プロジェクトについての説明
#   requires-python : Python のバージョン条件
#   dependencies    : 動作に必要なパッケージの一覧
#
# [tool.uv.sources]
#   llm-sdk をどこから持ってくるか（llm-sdk を置いてあるパス）
#
# [[tool.mypy.overrides]]
#   llm_sdk（配布されたもので自作コードではない）の mypy エラーを無視する

[project]
name = "Call-Me-Maybe"
version = "0.1"
description = "Translate natural language prompts into function calls using constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.0",
    "llm-sdk",
    "flake8",
    "mypy"
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }

[[tool.mypy.overrides]]
module = "llm_sdk"
ignore_errors = true
